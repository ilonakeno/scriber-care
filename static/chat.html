<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Care · Чат клієнта</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="hdr"></div>
<div class="chat-wrap stack">
  <div class="card">
    <div class="row" style="justify-content: space-between">
      <div><b>Чат підтримки</b> <span class="muted small">· так це бачить клієнт</span></div>
      <select id="doctor" style="width: auto"></select>
    </div>
  </div>
  <div class="card"><div class="msgs" id="msgs"><div class="muted">Напишіть, що сталося. Пояснювати деталі акаунта не потрібно: ми бачимо їх самі.</div></div></div>
  <div class="card row">
    <textarea id="text" rows="3" placeholder="Ваше повідомлення"></textarea>
    <button class="primary" id="send">Надіслати</button>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
document.getElementById("hdr").innerHTML = header("chat");
let caseIds = (new URLSearchParams(location.search).get("case") || "").split(",").filter(Boolean);

async function init() {
  const doctors = await api("/api/doctors");
  document.getElementById("doctor").innerHTML = doctors.map((d) =>
    `<option value="${d.id}">${esc(d.name)} · ${esc(d.clinic || "індивідуально")}</option>`).join("")
    + `<option value="">Гість без акаунта</option>`;
  renderStatus();
  if (caseIds.length) load();
}

async function load() {
  if (!caseIds.length) return;
  // Each message is its own case; the whole conversation stays on screen and in the AI context.
  const threads = await Promise.all(caseIds.map((id) => api(`/api/chat/${id}`)));
  const data = { case: threads[threads.length - 1].case, messages: threads.flatMap((t) => t.messages) };
  if (data.case.doctor_id) document.getElementById("doctor").value = data.case.doctor_id;
  document.getElementById("msgs").innerHTML = data.messages.map((m) =>
    `<div class="msg ${m.sender === "client" ? "me" : "them"}"><div class="who">${m.sender === "client" ? "Ви" : "Підтримка"} · ${m.ts.slice(11, 16)}</div>${esc(m.text)}</div>`).join("");
}

document.getElementById("send").onclick = async (e) => {
  const text = document.getElementById("text").value.trim();
  if (!text) return;
  e.target.disabled = true;
  document.getElementById("msgs").insertAdjacentHTML("beforeend", `<div class="msg me"><div class="who">Ви</div>${esc(text)}</div>`);
  document.getElementById("text").value = "";
  try {
    const res = await api("/api/chat", { doctor_id: document.getElementById("doctor").value, text });
    caseIds.push(String(res.case_id));
    history.replaceState(null, "", `/chat?case=${caseIds.join(",")}`);
    await load();
  } finally { e.target.disabled = false; }
};
document.getElementById("doctor").onchange = () => {  // another customer starts another conversation
  caseIds = [];
  document.getElementById("msgs").innerHTML = "";
  history.replaceState(null, "", "/chat");
};
init();
setInterval(load, 3000);
</script>
</body>
</html>
